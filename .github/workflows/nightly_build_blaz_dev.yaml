name: nightly_build_blaz_dev

on:
    schedule:
      - cron: '15 6 * * *'
    workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Cache PlatformIO
      uses: actions/cache@v3
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio
        wget https://github.com/blazoncek/WLED/archive/refs/heads/dev.zip -O /tmp/mm.zip
        unzip /tmp/mm.zip -d /tmp
    - name: Run PlatformIO
      run: |
        cd /tmp/WLED-dev        
        npm install
        
        sed -i -e 's/def create_release(source)/def create_release(source,builddir)/g' ./pio-scripts/output_bins.py
        sed -i -e 's/create_release(str(target\[0]))/create_release(str(target\[0]),builddir)/g' ./pio-scripts/output_bins.py
        sed -i -e 's/shutil\.copy(source, release_file)/shutil\.copy(source, release_file);partition_file = release_file\.replace("\.bin","_partitions\.bin");shutil\.copy(os\.path\.join(builddir,"partitions\.bin"), partition_file)/g' ./pio-scripts/output_bins.py
        # cat ./pio-scripts/output_bins.py
        
        pio run -e esp32dev || pio run -e esp32dev || true
        pio run -e esp32s3dev_16MB_opi || pio run -e esp32s3dev_16MB_opi || true
        pio run -e esp32s3dev_8MB_opi || pio run -e esp32s3dev_8MB_opi || true
        pio run -e esp32s3_4M_qspi || pio run -e esp32s3_4M_qspi || true

        # cat platformio.ini
      env:
        PLATFORMIO_CI_SRC: /tmp/WLED-dev
    - name: Copy Files
      run: |
        cd $GITHUB_WORKSPACE
        git rm -r $GITHUB_WORKSPACE/bin_dir/4_Blazoncek_Fork/Nightly_build/*.bin || true
        cp /tmp/WLED-dev/build_output/release/*.bin $GITHUB_WORKSPACE/bin_dir/4_Blazoncek_Fork/Nightly_build/
        date -I | tr -d '\n' >$GITHUB_WORKSPACE/bin_dir/4_Blazoncek_Fork/Nightly_build/lastupdate.txt
        echo -n ", version: " >>$GITHUB_WORKSPACE/bin_dir/4_Blazoncek_Fork/Nightly_build/lastupdate.txt
        versionvalue=($(jq -r '.version' /tmp/WLED-dev/package.json))
        echo -n "$versionvalue" >>$GITHUB_WORKSPACE/bin_dir/4_Blazoncek_Fork/Nightly_build/lastupdate.txt
    - name: Commit Files
      run: |
        cd $GITHUB_WORKSPACE
        git config user.name "GitHub Actions Bot"
        git config user.email "<>"
        git add $GITHUB_WORKSPACE/bin_dir/4_Blazoncek_Fork/Nightly_build/*.bin
        git add $GITHUB_WORKSPACE/bin_dir/4_Blazoncek_Fork/Nightly_build/lastupdate.txt
        git commit -m "Commit Blaz fork dev"
        git push origin main
